name: Tests

on:
  push: {}
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    # Observed run: setup-matlab's system-dependency apt-get step stalled on
    # a runner-side network/mirror hang for ~2h45m with no output at all
    # (unrelated to any code here) before it had to be cancelled manually.
    # Caps that failure mode to a fast, visible failure instead of silently
    # running toward GitHub's 6-hour default job timeout.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        with:
          # Pinned, not 'latest': README/RELEASE_NOTES promise support from
          # R2025a onward, so CI should keep validating that minimum
          # specifically rather than silently drifting to whatever release
          # 'latest' resolves to as new MATLAB versions ship.
          release: R2025a
          products: >
            Global_Optimization_Toolbox
            Optimization_Toolbox
            Parallel_Computing_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Financial_Toolbox

      # example.m and test_integration.m both abort on any uncaught error
      # (test_integration.m explicitly raises ISA:test_integration:caseFailures
      # if any case fails; buildIS.m/exploreIS.m abort before printing
      # EOF:SUCCESS), which run-command turns into a nonzero exit code and a
      # failed step -- no separate pass/fail parsing needed here.
      - uses: matlab-actions/run-command@v2
        with:
          command: example, test_integration

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-outputs
          path: test/data/
          retention-days: 14

      # test_integration.m (#39) always writes a Cobertura coverage report
      # via matlab.unittest's CodeCoveragePlugin, success or failure.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

      # Per-file coverage table in the job log and the run summary, so the
      # numbers can be read without downloading the artifact or relying on
      # Codecov being linked.
      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/coverage_summary.py coverage.xml | tee -a "$GITHUB_STEP_SUMMARY"

      # The standalone CLI download endpoint has failed TLS handshakes on
      # hosted runners. Use Codecov's supported PyPI distribution in a venv.
      - name: Prepare Codecov Python environment
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/codecov-venv"
          echo "$RUNNER_TEMP/codecov-venv/bin" >> "$GITHUB_PATH"

      # Reporting is independent of test success. Keep coverage thresholds in
      # Codecov; uploader/network failures must not relabel passing MATLAB tests.
      # continue-on-error also covers bootstrap failures before the CLI starts.
      - name: Upload coverage to Codecov
        id: codecov_coverage
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          use_pypi: true
          version: 11.3.1
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        id: codecov_results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          use_pypi: true
          version: 11.3.1
          fail_ci_if_error: true

      - name: Report upload failures
        if: ${{ !cancelled() && (steps.codecov_coverage.outcome == 'failure' || steps.codecov_results.outcome == 'failure') }}
        run: |
          echo "::warning::Codecov upload failed. Test results and coverage are retained in the coverage-report artifact."
          echo "Codecov upload failed; consult the coverage-report artifact for measured coverage and JUnit results." >> "$GITHUB_STEP_SUMMARY"
